<!--
  The careers page: each player's seasons, added up. This file is a template.

  CAREERS_LIMIT it fills it in 29 times: careers.html as an index, and a page
  for each initial beside it, careers-a.html to careers-other.html.

  The mark on the second line and the stamp above are all the left-behind report
  reads back, from the first kilobyte, so this comment goes after them and never
  before.

  HOW SITE.PY FILLS THIS IN. By sentinel comment, replaced literally. They are
  written below without their comment delimiters, because a real one here would
  end this comment early. The set is matchcentre/site.py's CAREERS_SENTINELS, and
  the suite checks the two against each other:

    TITLE          the site heading, as on the front page. Used twice.
    HEADING        this page's own heading: the page's name, and on a page
                   for one initial, which one.
    GENERATED      the stamp of the newest season document, raw.
    THEME-KEY      the localStorage key the front page and dashboards keep the
                   light/dark choice under.
    CAREERS        the page body, rendered by matchcentre/careers.py.
    FOOTER         the front page's footer line.

  No script but the theme reader below, and no data island: the figures are in the
  markup, so the page works with JavaScript off and opens by double-click. A split
  index adds one more at its foot, which takes a season page's link to a career
  on from the name's row to the initial's page; with scripts off the row is where
  the link lands, one click from the career.
-->
